[package]
name = "mallow-gumball"
version = "1.1.0"
description = "mallow Gumball: collaborative random sales of existing NFTs."
authors = ["Mallow Developers <dev@mallow.art>"]
repository = "https://github.com/mallow-labs/mallow-gumball"
license-file = "../../../LICENSE"
edition = "2021"
readme = "../README.md"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = {version = "1.1.2", features = ["init-if-needed", "event-cpi", "allow-missing-optionals"]}
anchor-spl = {version = "1.1.2", features = ["metadata"]}
arrayref = ">=0.3.6"
borsh = "1"
solana-program = "4.0.0"
mpl-token-metadata = { version = "=5.1.2-alpha.2" }
mpl-core = { version = "0.12.1" }
mpl-bubblegum = "3.0.0"
utils = { path="../../utils" }