[package]
name = "gumball-guard"
version = "1.0.0"
description = "mallow Gumball Guard: programmatic access control for mallow Gumball."
authors = ["mallow Developers <dev@mallow.art>"]
repository = "https://github.com/mallow-labs/mallow-gumball"
license-file = "../../../LICENSE"
edition = "2021"
readme = "../README.md"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
test-bpf = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "mallow-jellybean-client/anchor-idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["metadata", "token_2022"] }
arrayref = ">=0.3.6"
borsh = "1"
gumball-guard-derive = { path = "../macro", version = "0.2.0" }
mallow-gumball = { path = "../../mallow-gumball/program", features = ["cpi"] }
mallow-jellybean-client = { version = "1.0.0-alpha.0", features = ["anchor"] }
mpl-token-metadata = { version = "=5.1.2-alpha.2" }
mpl-core = { version = "0.12.1" }
solana-program = "4.0.0"
# anchor-spl 1.1.2 pairs with the split-out `spl-token-2022-interface` (v2). Pull
# the same crate (renamed to keep the `spl_token_2022` import path) so there's a
# single, version-unified token-2022 in the graph.
spl-token-2022 = { package = "spl-token-2022-interface", version = "2" }
utils = { path="../../utils" }