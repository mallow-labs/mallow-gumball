# This file is used by the dorny/paths-filter action to figure out if a program or
# client has changed and thus if it should be built or tested. Any changes in the
# files listed below will trigger the appropriate workflow for that program or client.

# Programs.

program_common: &program_common
  - ".github/workflows/build-programs.yml"
  - ".github/workflows/test-programs.yml"
  - ".github/workflows/main.yml"
  - ".github/.env"
  - "programs/utils/**"
  - "clients/rust/**"

mallow_gumball_program: &mallow_gumball_program
  - *program_common
  - "programs/mallow-gumball/**"

gumball_guard_program: &gumball_guard_program
  - *program_common
  - "programs/gumball-guard/**"

programs: &programs
  - *mallow_gumball_program
  - *gumball_guard_program

# Clients.

client_common: &client_common
  - *programs
  - ".github/workflows/test-js.yml"
  - ".github/workflows/main.yml"
  - "codama.mjs"
  - "idls/**"
  - "pnpm-lock.yaml"
  - ".github/file-filters.yml"
  - "configs/program-scripts/**"
  - "docs/cnft-v2.md"
  - "docs/cnft-v2-metrics.json"
  - "package.json"

js_client: &js_client
  - *client_common
  - "clients/js/**"
  - "clients/umi/**"

clients: &clients
  - *js_client

# Any.

any: &any
  - *programs
  - *clients
